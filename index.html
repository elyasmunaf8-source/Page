<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Schul-Toilettenverwaltung</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    min-height: 100vh;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: auto;
    overflow: hidden;
}

/* HEADER */

header {
    background: rgba(255,255,255,0.95);
    padding: 20px;
    text-align: center;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

header h1 {
    margin: 0;
    color: #45458c;
}

header p {
    margin-bottom: 0;
    color: #777;
}

/* SEITEN */

.pages {
    display: flex;
    width: 200%;
    transition: transform 0.35s ease;
}

.page {
    width: 50%;
    padding: 20px;
}

/* KARTEN */

.card {
    background: rgba(255,255,255,0.96);
    padding: 22px;
    margin-bottom: 20px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}

h2 {
    color: #5555a5;
    margin-top: 0;
}

/* EINGABEN */

label {
    display: block;
    font-weight: bold;
    color: #444;
    margin-top: 10px;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    margin-top: 7px;
    margin-bottom: 12px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

/* BUTTONS */

button {
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.02);
}

.approve {
    width: 100%;
    background: #7bed9f;
    color: #14532d;
}

.back {
    width: 100%;
    margin-top: 12px;
    background: #70a1ff;
    color: white;
}

.mark {
    width: 100%;
    margin-top: 10px;
    background: #ffb142;
    color: #5a3000;
}

.report {
    width: 100%;
    background: #ff6b81;
    color: white;
}

.delete {
    width: 100%;
    background: #ff4757;
    color: white;
    margin-top: 10px;
}

/* NAVIGATION */

.navigation {
    display: flex;
    gap: 10px;
    padding: 15px 20px;
    background: rgba(255,255,255,0.9);
}

.navigation button {
    flex: 1;
    background: #ddd;
    color: #555;
}

.navigation button.active {
    background: #7067d8;
    color: white;
}

/* TOILETTENGANG */

.toilet-card {
    padding: 16px;
    margin-top: 12px;
    border-radius: 14px;
    border-left: 8px solid;
    transition: 0.5s;
}

/* GRÜN */

.green {
    background: #e7faed;
    border-left-color: #2ed573;
}

/* GELB */

.yellow {
    background: #fff6cc;
    border-left-color: #f9ca24;
}

/* ROT */

.red {
    background: #ffe6e6;
    border-left-color: #ff4757;
}

/* MARKIERT */

.marked {
    box-shadow: 0 0 0 3px #ff9f43 inset;
}

/* BADGES */

.badge {
    display: inline-block;
    padding: 5px 9px;
    margin-top: 8px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.warning {
    background: #ffb142;
    color: #5a3000;
}

.danger {
    background: #ff4757;
    color: white;
}

.info {
    background: #70a1ff;
    color: white;
}

/* STATISTIK */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    text-align: center;
    background: #f4f3ff;
    padding: 15px 8px;
    border-radius: 15px;
}

.stat strong {
    display: block;
    font-size: 24px;
    color: #5555a5;
}

/* MELDUNG */

.message {
    text-align: center;
    color: #5555a5;
    font-weight: bold;
    margin-top: 12px;
}

.empty {
    text-align: center;
    color: #777;
}

/* VORFALL */

.incident {
    padding: 15px;
    background: #fff0f2;
    border-left: 7px solid #ff6b81;
    border-radius: 12px;
    margin-top: 10px;
}

/* MOBILE */

@media (max-width: 600px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .page {
        padding: 12px;
    }

}

</style>
</head>


<body>

<div class="app">

<header>
    <h1>🚻 Schul-Toilettenverwaltung</h1>
    <p>Jungentoilette</p>
</header>


<!-- NAVIGATION -->

<div class="navigation">

    <button
        id="navHome"
        class="active"
        onclick="showPage(0)"
    >
        🚻 Toilette
    </button>

    <button
        id="navReport"
        onclick="showPage(1)"
    >
        📋 Übersicht
    </button>

</div>


<!-- SEITEN -->

<div
    class="pages"
    id="pages"
>


<!-- ==================== SEITE 1 ==================== -->

<div class="page">

    <div class="card">

        <h2>📝 Toilettengang genehmigen</h2>

        <label>Lehrkraft</label>

        <input
            id="teacher"
            type="text"
            placeholder="Name der Lehrkraft"
        >

        <label>
            Vorname und Nachname des Schülers
        </label>

        <input
            id="studentName"
            type="text"
            placeholder="Vorname Nachname"
        >

        <button
            class="approve"
            onclick="startToilet()"
        >
            ✓ Toilette genehmigen
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </div>


    <!-- AKTUELL AUF TOILETTE -->

    <div class="card">

        <h2>🚶 Gerade auf der Toilette</h2>

        <div id="activeList"></div>

    </div>


    <!-- MELDEN -->

    <div class="card">

        <h2>🚨 Vorfall melden</h2>

        <label>Beschreibung</label>

        <textarea
            id="incidentText"
            placeholder="Was wurde festgestellt?"
        ></textarea>

        <button
            class="report"
            onclick="reportIncident()"
        >
            🚨 Vorfall melden
        </button>

        <div
            id="incidentMessage"
            class="message"
        ></div>

    </div>

</div>



<!-- ==================== SEITE 2 ==================== -->

<div class="page">

    <div class="card">

        <h2>📋 Tagesübersicht</h2>

        <label>Datum auswählen</label>

        <input
            type="date"
            id="selectedDate"
            onchange="renderOverview()"
        >

    </div>


    <!-- STATISTIK -->

    <div class="card">

        <h2>📊 Statistik</h2>

        <div class="stats">

            <div class="stat">
                <strong id="statTrips">0</strong>
                Toilettengänge
            </div>

            <div class="stat">
                <strong id="statStudents">0</strong>
                Schüler
            </div>

            <div class="stat">
                <strong id="statMarked">0</strong>
                Markiert
            </div>

        </div>

    </div>


    <!-- PROTOKOLL -->

    <div class="card">

        <h2>🗂️ Protokoll</h2>

        <div id="logList"></div>

    </div>


    <!-- VORFÄLLE -->

    <div class="card">

        <h2>🚨 Gemeldete Vorfälle</h2>

        <div id="incidentList"></div>

    </div>


    <div class="card">

        <button
            class="delete"
            onclick="clearLog()"
        >
            🗑️ Gesamtes Protokoll löschen
        </button>

    </div>

</div>

</div>

</div>



<script>

/* =========================
   DATEN
========================= */

let toiletTrips =
    JSON.parse(
        localStorage.getItem("toiletTrips")
    ) || [];


let incidents =
    JSON.parse(
        localStorage.getItem("incidents")
    ) || [];


/* =========================
   SPEICHERN
========================= */

function saveData() {

    localStorage.setItem(
        "toiletTrips",
        JSON.stringify(toiletTrips)
    );

    localStorage.setItem(
        "incidents",
        JSON.stringify(incidents)
    );

}


/* =========================
   ZEIT
========================= */

function getTime() {

    return new Date().toLocaleTimeString(
        "de-DE",
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );

}


function getDate() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


/* =========================
   ZEIT IN MINUTEN
========================= */

function getDuration(trip) {

    const start =
        new Date(trip.startTimestamp);

    const end =
        trip.endTimestamp
        ? new Date(trip.endTimestamp)
        : new Date();

    return Math.floor(
        (end - start) / 60000
    );

}


/* =========================
   FARBE BESTIMMEN
========================= */

function getColorClass(trip) {

    const minutes =
        getDuration(trip);


    if (minutes >= 7) {

        return "red";

    }


    if (minutes >= 5) {

        return "yellow";

    }


    return "green";

}


/* =========================
   TOILETTE STARTEN
========================= */

function startToilet() {

    const teacher =
        document
        .getElementById("teacher")
        .value
        .trim();


    const studentName =
        document
        .getElementById("studentName")
        .value
        .trim();


    if (!teacher || !studentName) {

        document
        .getElementById("message")
        .textContent =
        "Bitte Lehrkraft und Schülernamen eingeben.";

        return;

    }


    const alreadyActive =
        toiletTrips.some(
            trip =>
                trip.studentName
                === studentName &&
                trip.endTimestamp
                === null
        );


    if (alreadyActive) {

        document
        .getElementById("message")
        .textContent =
        "Dieser Schüler ist bereits unterwegs.";

        return;

    }


    const now =
        new Date();


    const trip = {

        id: Date.now(),

        teacher:
            teacher,

        studentName:
            studentName,

        date:
            getDate(),

        startTime:
            getTime(),

        startTimestamp:
            now.toISOString(),

        endTime:
            null,

        endTimestamp:
            null,

        suspicious:
            false

    };


    toiletTrips.push(trip);

    saveData();


    document
    .getElementById("studentName")
    .value = "";


    document
    .getElementById("message")
    .textContent =
    "✓ Toilettengang wurde genehmigt.";


    render();

}


/* =========================
   ZURÜCKGEKOMMEN
========================= */

function finishToilet(id) {

    const trip =
        toiletTrips.find(
            trip =>
                trip.id === id
        );


    if (!trip) return;


    const now =
        new Date();


    trip.endTime =
        getTime();

    trip.endTimestamp =
        now.toISOString();


    saveData();

    render();

}


/* =========================
   MARKIEREN
========================= */

function toggleSuspicious(id) {

    const trip =
        toiletTrips.find(
            trip =>
                trip.id === id
        );


    if (!trip) return;


    trip.suspicious =
        !trip.suspicious;


    saveData();

    render();

}


/* =========================
   VORFALL MELDEN
========================= */

function reportIncident() {

    const description =
        document
        .getElementById("incidentText")
        .value
        .trim();


    if (!description) {

        document
        .getElementById("incidentMessage")
        .textContent =
        "Bitte eine Beschreibung eingeben.";

        return;

    }


    const incident = {

        id: Date.now(),

        date:
            getDate(),

        time:
            getTime(),

        description:
            description

    };


    incidents.push(incident);

    saveData();


    document
    .getElementById("incidentText")
    .value = "";


    document
    .getElementById("incidentMessage")
    .textContent =
    "✓ Vorfall wurde gespeichert.";


    renderOverview();

}


/* =========================
   SEITE WECHSELN
========================= */

function showPage(page) {

    const pages =
        document.getElementById(
            "pages"
        );


    if (page === 0) {

        pages.style.transform =
            "translateX(0%)";

    } else {

        pages.style.transform =
            "translateX(-50%)";

        renderOverview();

    }


    document
    .getElementById("navHome")
    .classList
    .toggle(
        "active",
        page === 0
    );


    document
    .getElementById("navReport")
    .classList
    .toggle(
        "active",
        page === 1
    );

}


/* =========================
   HAUPTANZEIGE
========================= */

function render() {

    const activeList =
        document.getElementById(
            "activeList"
        );


    activeList.innerHTML = "";


    const active =
        toiletTrips.filter(
            trip =>
                trip.endTimestamp === null
        );


    if (active.length === 0) {

        activeList.innerHTML =
            '<p class="empty">' +
            'Momentan ist niemand auf der Toilette.' +
            '</p>';

    }


    active.forEach(trip => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "toilet-card " +
            getColorClass(trip) +
            (trip.suspicious
                ? " marked"
                : "");


        const minutes =
            getDuration(trip);


        div.innerHTML = `

            <strong>
                👤 ${escapeHTML(
                    trip.studentName
                )}
            </strong>

            <br><br>

            👩‍🏫 Lehrkraft:
            ${escapeHTML(
                trip.teacher
            )}

            <br>

            🕐 Beginn:
            ${trip.startTime}

            <br>

            ⏱️ Dauer:
            <span class="duration">
                ${minutes} Minute${
                    minutes === 1
                    ? ""
                    : "n"
                }
            </span>

            ${
                trip.suspicious
                ? `
                    <br>
                    <span class="badge warning">
                        ⚠️ Zur Überprüfung markiert
                    </span>
                `
                : ""
            }


            <button
                class="back"
                onclick="finishToilet(
                    ${trip.id}
                )"
            >
                ✓ Zurückgekommen
            </button>


            <button
                class="mark"
                onclick="toggleSuspicious(
                    ${trip.id}
                )"
            >
                ${
                    trip.suspicious
                    ? "✓ Markierung entfernen"
                    : "⚠️ Zur Überprüfung markieren"
                }
            </button>

        `;


        activeList.appendChild(div);

    });

}


/* =========================
   ÜBERSICHT
========================= */

function renderOverview() {

    const selected =
        document
        .getElementById(
            "selectedDate"
        )
        .value
        || getDate();


    const trips =
        toiletTrips.filter(
            trip =>
                trip.date === selected
        );


    const uniqueStudents =
        new Set(
            trips.map(
                trip =>
                    trip.studentName
            )
        );


    const marked =
        trips.filter(
            trip =>
                trip.suspicious
        );


    document
    .getElementById(
        "statTrips"
    )
    .textContent =
    trips.length;


    document
    .getElementById(
        "statStudents"
    )
    .textContent =
    uniqueStudents.size;


    document
    .getElementById(
        "statMarked"
    )
    .textContent =
    marked.length;


    const logList =
        document.getElementById(
            "logList"
        );


    logList.innerHTML = "";


    if (trips.length === 0) {

        logList.innerHTML =
            '<p class="empty">' +
            'Keine Einträge für diesen Tag.' +
            '</p>';

    }


    [...trips]
    .reverse()
    .forEach(trip => {

        const div =
            document.createElement(
                "div"
            );


        const color =
            getColorClass(trip);


        div.className =
            "toilet-card " +
            color +
            (trip.suspicious
                ? " marked"
                : "");


        div.innerHTML = `

            <strong>
                👤 ${escapeHTML(
                    trip.studentName
                )}
            </strong>

            <br>

            👩‍🏫 ${escapeHTML(
                trip.teacher
            )}

            <br>

            🟢 Hin:
            ${trip.startTime}

            <br>

            🔵 Zurück:
            ${
                trip.endTime
                || "noch unterwegs"
            }

            ${
                trip.suspicious
                ? `
                    <br>
                    <span class="badge warning">
                        ⚠️ Zur Überprüfung markiert
                    </span>
                `
                : ""
            }

        `;


        logList.appendChild(div);

    });


    renderIncidents(selected);

}


/* =========================
   VORFÄLLE
========================= */

function renderIncidents(date) {

    const list =
        document.getElementById(
            "incidentList"
        );


    list.innerHTML = "";


    const selectedIncidents =
        incidents.filter(
            incident =>
                incident.date === date
        );


    if (
        selectedIncidents.length === 0
    ) {

        list.innerHTML =
            '<p class="empty">' +
            'Keine Vorfälle gemeldet.' +
            '</p>';

        return;

    }


    [...selectedIncidents]
    .reverse()
    .forEach(incident => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "incident";


        div.innerHTML = `

            <strong>
                🚨 ${incident.time}
            </strong>

            <br><br>

            ${escapeHTML(
                incident.description
            )}

        `;


        list.appendChild(div);

    });

}


/* =========================
   DATEN LÖSCHEN
========================= */

function clearLog() {

    const answer =
        confirm(
            "Soll wirklich das gesamte Protokoll gelöscht werden?"
        );


    if (!answer) return;


    toiletTrips = [];

    incidents = [];


    saveData();

    render();

    renderOverview();

}


/* =========================
   SICHERHEIT
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================
   SWIPE AUF HANDY
========================= */

let touchStartX = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0].screenX;

    }
);


document.addEventListener(
    "touchend",
    function(event) {

        const touchEndX =
            event.changedTouches[0].screenX;


        const difference =
            touchEndX - touchStartX;


        if (Math.abs(difference) < 70) {
            return;
        }


        if (difference < 0) {

            showPage(1);

        } else {

            showPage(0);

        }

    }
);


/* =========================
   AUTOMATISCHE AKTUALISIERUNG
========================= */

setInterval(
    function() {

        render();

    },
    1000
);


/* =========================
   START
========================= */

document
.getElementById(
    "selectedDate"
)
.value =
getDate();


render();

renderOverview();

</script>

</body>
</html>
